[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-operator"
version = "0.1.0"
description = "Local-first red team, pentest, and CTF notebook with command logging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlmodel>=0.0.16",
  "typer>=0.9",
  "rich>=13.7",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "markdown>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
trace = "traceapp.cli:app"

[tool.setuptools.packages.find]
include = ["traceapp*"]

[tool.setuptools.package-data]
traceapp = ["templates/*.html", "static/*"]
