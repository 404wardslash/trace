{% extends "base.html" %}
{% block content %}
<header class="top"><h1>Evidence</h1></header>
<form class="inline-form" action="/evidence" method="post" enctype="multipart/form-data"><input type="file" name="upload" required><select name="target_id"><option value="">Target</option>{% for t in targets %}<option value="{{ t.id }}">{{ t.nickname }}</option>{% endfor %}</select><select name="finding_id"><option value="">Finding</option>{% for f in findings %}<option value="{{ f.id }}">{{ f.title }}</option>{% endfor %}</select><input name="notes" placeholder="notes"><button>Upload</button></form>
<div class="evidence-grid">
  {% for ev in evidence %}
  <article class="item">{% if ev.mime_type.startswith("image/") %}<img src="/evidence/{{ ev.id }}/file" alt="{{ ev.filename }}">{% endif %}<a href="/evidence/{{ ev.id }}/file">{{ ev.filename }}</a>
    <form class="stack compact" action="/evidence/{{ ev.id }}" method="post">
      <textarea name="notes" placeholder="notes">{{ ev.notes }}</textarea>
      <div class="row"><select name="target_id"><option value="">Unassigned</option>{% for t in targets %}<option value="{{ t.id }}" {{ "selected" if ev.target_id==t.id else "" }}>{{ t.nickname }}</option>{% endfor %}</select><select name="finding_id"><option value="">No finding</option>{% for f in findings %}<option value="{{ f.id }}" {{ "selected" if ev.finding_id==f.id else "" }}>{{ f.title }}</option>{% endfor %}</select><button>Save</button></div>
    </form>
    <form action="/evidence/{{ ev.id }}/delete" method="post" onsubmit="return confirm('Delete this evidence file and metadata?');"><button class="danger">Delete evidence</button></form>
  </article>
  {% endfor %}
</div>
{% endblock %}
