{% extends "base.html" %}
{% block content %}
<header class="top"><h1>Credentials</h1></header>
<form class="inline-form" action="/credentials" method="post">
  <input name="username" placeholder="username"><input name="secret" placeholder="password/hash/token"><input name="service" placeholder="service">
  <select name="target_id"><option value="">Target</option>{% for t in targets %}<option value="{{ t.id }}">{{ t.nickname }}</option>{% endfor %}</select>
  <select name="status"><option>unknown</option><option>valid</option><option>invalid</option></select><button>Add</button>
</form>
{% for c in creds %}
<details class="item">
  <summary><span class="mono">{{ c.username }}</span> / <span class="mono">{{ c.secret }}</span> {{ c.service }} <span class="muted">{{ c.status.value }}</span></summary>
  <form class="stack compact" action="/credentials/{{ c.id }}" method="post">
    <div class="row"><input name="username" value="{{ c.username }}" placeholder="username"><input name="secret" value="{{ c.secret }}" placeholder="password/hash/token"><input name="credential_type" value="{{ c.credential_type }}"><input name="service" value="{{ c.service }}"></div>
    <div class="row"><select name="target_id"><option value="">Unassigned</option>{% for t in targets %}<option value="{{ t.id }}" {{ "selected" if c.target_id==t.id else "" }}>{{ t.nickname }}</option>{% endfor %}</select><select name="status">{% for s in ["unknown","valid","invalid"] %}<option {{ "selected" if c.status.value==s else "" }}>{{ s }}</option>{% endfor %}</select><input name="tags" value="{{ c.tags }}" placeholder="tags"><input name="source_note" value="{{ c.source_note }}" placeholder="source"><button>Save</button></div>
  </form>
  <form action="/credentials/{{ c.id }}/delete" method="post" onsubmit="return confirm('Delete this credential?');"><button class="danger">Delete credential</button></form>
</details>
{% endfor %}
{% endblock %}
